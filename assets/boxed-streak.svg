<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Rounded dark card background with subtle gradient stroke -->
  <rect x="20" y="18" rx="16" ry="16" width="860" height="190" fill="#0c1220" stroke="url(#accent)" stroke-width="2" opacity="0.98" filter="url(#shadow)" />

  <!-- Inner padding area (visual only) -->
  <rect x="36" y="36" rx="10" ry="10" width="824" height="154" fill="transparent" stroke-opacity="0" />

  <!-- Embed streak widget image inside the card with padding. Using a slightly smaller area to create inner margins -->
  <image href="https://nirzak-streak-stats.vercel.app/?user=shaharan1&theme=dark&hide_border=true" x="48" y="46" width="800" height="134" preserveAspectRatio="xMidYMid meet" />

  <!-- Accent divider line -->
  <rect x="60" y="184" width="780" height="1" fill="url(#accent)" opacity="0.6" />

  <!-- Optional small caption -->
  <text x="36" y="211" font-family="Segoe UI, Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#9AA7C7">Live streak card • Theme: dark • Styled accent: purple → cyan</text>
</svg>
