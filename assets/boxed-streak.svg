<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Rounded dark card background -->
  <rect x="10" y="10" rx="12" ry="12" width="880" height="200" fill="#0b1220" filter="url(#shadow)" />
  <!-- Embed streak widget image inside the card with padding -->
  <image href="https://nirzak-streak-stats.vercel.app/?user=shaharan1&theme=dark&hide_border=true" x="40" y="20" width="820" height="160" preserveAspectRatio="xMidYMid meet" />
  <!-- Optional small caption -->
  <text x="30" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9AA7C7">Updated live via nirzak-streak-stats</text>
</svg>
